{% extends 'accounts/reader_base.html' %}
{% block title %}Créer une critique — LITRevu{% endblock %}
{% block content %}
    <section class="ticket-editor" aria-labelledby="page-title">
        <h1 id="page-title">Créer une critique</h1>
        <form method="post" enctype="multipart/form-data" class="account-form review-form">
            {% csrf_token %}
            <h2>Le livre ou l’article</h2>
            {{ ticket_form.as_div }}
            <h2>Votre critique</h2>
            {{ review_form.as_div }}
            <button type="submit">Publier ma critique</button>
        </form>
        <a class="reader-text-link" href="{% url 'accounts:home' %}">Annuler et revenir à mon espace</a>
    </section>
{% endblock %}
